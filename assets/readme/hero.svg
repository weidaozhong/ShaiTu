<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">晒图 · ShaiTu — 截图随手可取，文字本地识别</title>
  <desc id="desc">Windows 截图晾衣绳与本地取字工具。暖白背景上，两张示意照片由黄色夹子挂在绳上，呼应截图暂存、随手取用和本地文字识别的用途。</desc>
