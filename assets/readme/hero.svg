    <text x="59" y="208" font-size="112" font-weight="700" fill="#29323C">晒图</text>
    <text x="318" y="200" font-size="32" font-weight="600" fill="#4F706C">ShaiTu</text>
    <text x="64" y="296" font-size="52" font-weight="600" fill="#29323C">让截图随手可取</text>
    <text x="66" y="349" font-size="22" fill="#59636A">Snipaste 钉图 · 本地取字 · 桌面随取</text>
    <text x="66" y="379" font-size="16" fill="#7A858B">本地识别 · 图片不上传 · 解压即用</text>
  </g>
